# Development override - extends docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # ============================================
  # Infrastructure (from docker-compose.yml)
  # ============================================
  postgres:
    extends:
      file: docker-compose.yml
      service: postgres

  rabbitmq:
    extends:
      file: docker-compose.yml
      service: rabbitmq

  # ============================================
  # Application Services
  # ============================================
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: dreamfitness-api-gateway
    volumes:
      - ./apps:/app/apps:cached
      - ./libs:/app/libs:cached
      - ./node_modules:/app/node_modules:delegated
    ports:
      - "${API_GATEWAY_PORT:-3000}:${API_GATEWAY_PORT:-3000}"
    environment:
      - NODE_ENV=development
    env_file:
      - .env
      - .env.development
      - .env.docker
    depends_on:
      notification-service:
        condition: service_healthy
    command: npm run start:dev:api-gateway
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dreamfitness-network

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: dreamfitness-auth-service
    volumes:
      - ./apps:/app/apps:cached
      - ./libs:/app/libs:cached
      - ./node_modules:/app/node_modules:delegated
    ports:
      - "${AUTH_SERVICE_PORT:-3001}:${AUTH_SERVICE_PORT:-3001}"
    environment:
      - NODE_ENV=development
    env_file:
      - .env
      - .env.development
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    entrypoint: ["sh", "/app/scripts/docker-entrypoint.sh"]
    command: ["npm", "run", "start:dev:auth-service"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks:
      - dreamfitness-network

  training-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: dreamfitness-training-service
    volumes:
      - ./apps:/app/apps:cached
      - ./libs:/app/libs:cached
      - ./node_modules:/app/node_modules:delegated
    ports:
      - "${TRAINING_SERVICE_PORT:-3002}:${TRAINING_SERVICE_PORT:-3002}"
    environment:
      - NODE_ENV=development
    env_file:
      - .env
      - .env.development
      - .env.docker
    depends_on:
      auth-service:
        condition: service_healthy
    command: npm run start:dev:training-service
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dreamfitness-network

  booking-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: dreamfitness-booking-service
    volumes:
      - ./apps:/app/apps:cached
      - ./libs:/app/libs:cached
      - ./node_modules:/app/node_modules:delegated
    ports:
      - "${BOOKING_SERVICE_PORT:-3003}:${BOOKING_SERVICE_PORT:-3003}"
    environment:
      - NODE_ENV=development
    env_file:
      - .env
      - .env.development
      - .env.docker
    depends_on:
      training-service:
        condition: service_healthy
    command: npm run start:dev:booking-service
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dreamfitness-network

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: dreamfitness-notification-service
    volumes:
      - ./apps:/app/apps:cached
      - ./libs:/app/libs:cached
      - ./node_modules:/app/node_modules:delegated
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-3004}:${NOTIFICATION_SERVICE_PORT:-3004}"
    environment:
      - NODE_ENV=development
    env_file:
      - .env
      - .env.development
      - .env.docker
    depends_on:
      booking-service:
        condition: service_healthy
    command: npm run start:dev:notification-service
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3004/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dreamfitness-network

networks:
  dreamfitness-network:
    driver: bridge