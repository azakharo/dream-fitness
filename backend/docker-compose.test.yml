# Test override - extends docker-compose.prod.yml with port exposure for integration testing
# Usage: docker-compose -f docker-compose.base.yml -f docker-compose.prod.yml -f docker-compose.test.yml up -d

services:
  api-gateway:
    ports:
      - "${API_GATEWAY_PORT:-3000}:${API_GATEWAY_PORT:-3000}"

  auth-service:
    ports:
      - "${AUTH_SERVICE_PORT:-3001}:${AUTH_SERVICE_PORT:-3001}"

  training-service:
    ports:
      - "${TRAINING_SERVICE_PORT:-3002}:${TRAINING_SERVICE_PORT:-3002}"

  booking-service:
    ports:
      - "${BOOKING_SERVICE_PORT:-3003}:${BOOKING_SERVICE_PORT:-3003}"

  notification-service:
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-3004}:${NOTIFICATION_SERVICE_PORT:-3004}"
