services:
  postgres:
    image: postgres:16-alpine
    container_name: dreamfitness-postgres
    environment:
      POSTGRES_USER: dreamfitness
      POSTGRES_PASSWORD: dreamfitness123
      POSTGRES_DB: dreamfitness
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dreamfitness"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: dreamfitness-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: dreamfitness
      RABBITMQ_DEFAULT_PASS: dreamfitness123
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_data:
