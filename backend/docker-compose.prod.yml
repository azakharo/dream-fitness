# Production override - extends docker-compose.base.yml
# Usage: docker compose -f docker-compose.base.yml -f docker-compose.prod.yml up -d

services:
  # ============================================
  # Infrastructure (from docker-compose.base.yml)
  # ============================================
  postgres:
    extends:
      file: docker-compose.base.yml
      service: postgres
    restart: always

  rabbitmq:
    extends:
      file: docker-compose.base.yml
      service: rabbitmq
    restart: always

  # ============================================
  # Application Services
  # ============================================
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      - NODE_ENV=${NODE_ENV:-production}
    env_file:
      - .env
      - .env.${NODE_ENV:-production}
      - .env.docker
    depends_on:
      notification-service:
        condition: service_healthy
    restart: always
    command: node dist/apps/api-gateway/main.js
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dreamfitness-network
    ports:
      - "${API_GATEWAY_PORT:-3000}:${API_GATEWAY_PORT:-3000}"

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      - NODE_ENV=${NODE_ENV:-production}
    env_file:
      - .env
      - .env.${NODE_ENV:-production}
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: always
    command: node dist/apps/auth-service/main.js
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - dreamfitness-network

  training-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      - NODE_ENV=${NODE_ENV:-production}
    env_file:
      - .env
      - .env.${NODE_ENV:-production}
      - .env.docker
    depends_on:
      auth-service:
        condition: service_healthy
    restart: always
    command: node dist/apps/training-service/main.js
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dreamfitness-network

  booking-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      - NODE_ENV=${NODE_ENV:-production}
    env_file:
      - .env
      - .env.${NODE_ENV:-production}
      - .env.docker
    depends_on:
      training-service:
        condition: service_healthy
    restart: always
    command: node dist/apps/booking-service/main.js
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dreamfitness-network

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      - NODE_ENV=${NODE_ENV:-production}
    env_file:
      - .env
      - .env.${NODE_ENV:-production}
      - .env.docker
    depends_on:
      booking-service:
        condition: service_healthy
    restart: always
    command: node dist/apps/notification-service/main.js
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3004/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dreamfitness-network

networks:
  dreamfitness-network:
    driver: bridge