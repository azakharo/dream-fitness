# Migration Runner - Root-level Docker Compose configuration
# Usage from root:
#   1. First ensure PostgreSQL is running: docker compose -f docker-compose.prod.yml up -d postgres rabbitmq
#   2. Then run migrations: docker compose -f docker-compose.migrations.yml run --rm -e RUN_MIGRATIONS=true -e RUN_SEED=true migration-runner

services:
  migration-runner:
    build:
      context: ./backend
      dockerfile: Dockerfile.migrations
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-false}
      - RUN_SEED=${RUN_SEED:-false}
    env_file:
      - ./backend/.env
      - ./backend/.env.${NODE_ENV:-production}
      - ./backend/.env.docker
    networks:
      - dreamfitness-network

networks:
  dreamfitness-network:
    external: true