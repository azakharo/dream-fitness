# Migration Runner - Root-level Docker Compose configuration
# Usage from root: docker compose -f docker-compose.migrations.yml run --rm -e RUN_MIGRATIONS=true -e RUN_SEED=true migration-runner

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USER:-dreamfitness}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-dreamfitness123}
      POSTGRES_DB: ${DATABASE_NAME:-dreamfitness}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-dreamfitness}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dreamfitness-network

  migration-runner:
    build:
      context: ./backend
      dockerfile: Dockerfile.migrations
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-false}
      - RUN_SEED=${RUN_SEED:-false}
    env_file:
      - ./backend/.env
      - ./backend/.env.${NODE_ENV:-production}
      - ./backend/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dreamfitness-network

volumes:
  postgres_data:

networks:
  dreamfitness-network:
    driver: bridge